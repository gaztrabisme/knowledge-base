[project]
name = "knowledge-base"
version = "0.1.0"
description = "MCP server for semantic search over developer knowledge base"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.13",
    "qdrant-client>=1.12",
    "openai>=1.0",
    "sentence-transformers>=5.5",
    "markitdown>=0.1",
    "fastembed>=0.3",
]

[project.scripts]
kb-server = "knowledge_base.server:main"
